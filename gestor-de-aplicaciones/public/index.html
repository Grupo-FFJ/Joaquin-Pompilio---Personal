<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publicaciones</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <section>
        <button id="consultar">Consultar estado - modificado</button>
        <button id="consultar-inactivas">Consultar inactivas</button>
        <p id="estado-comunidad"></p>
        <p id="estado-inactivas"></p>
    </section>

    <!-- Formulario adaptado a las reglas del dominio y req.body  EJERCICIO 16 - PARTE 2 --> 
    <form id="form-publicacion" action="/publicaciones" method="post">
        <label>Autor
            <input id="autor" name="autor" required>
        </label>
        <small id="error-autor" class="error"></small>

        <label>Título
            <input id="titulo" name="titulo" minlength="5" maxlength="80" required>
        </label>
        <small id="error-titulo" class="error"></small>

        <label>Descripción
            <textarea id="descripcion" name="descripcion" minlength="20" maxlength="500" required></textarea>
        </label>
        <small>Caracteres: <span id="contador">0</span></small>

        <label>Categoría
            <select id="categoria" name="categoria" required>
                <option value="general">General</option>
                <option value="aviso">Aviso</option>
                <option value="evento">Evento</option>
                <option value="compraventa">Compra-venta</option>
            </select>
        </label>

        <div id="campos-especificos"></div>
        <button type="submit">Publicar</button>
    </form>
    
    <p id="salida"></p>

    <output id="vista-previa"></output>
    <button id="btn-actualizar">Actualizar</button>
    <button id="btn-forzar-error">Forzar error</button>
    <p id="estado">Listo</p>
    <section id="lista-publicaciones"></section>

    <script type="module" src="./js/app.js"></script>
</body>

</html>
