<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <section>
        <button id="consultar">Consultar estado - modificado</button>
        <button id="consultar-inactivas">Consultar inactivas</button>
        <p id="estado-comunidad"></p>
        <p id="estado-inactivas"></p>
    </section>

    <form id="form-publicacion" action="/publicaciones" method="post">
        <input id="titulo" name="titulo" placeholder="Título" required>
        <small id="error-titulo" class="error"></small>
        <textarea id="descripcion" name="descripcion" placeholder="Descripción"></textarea>
        <small>Caracteres: <span id="contador">0</span></small>
        <input id="autor" class="autor" placeholder="Nombre del autor" required>
        <small id="error-autor" class="error"></small>
        <input id="email" type="email" placeholder="Email" required>
        <small id="ayuda-email"></small> j
        <select id="tipo">
            <option value="venta">Venta</option>
            <option value="servicio">Servicio</option>
        </select>
        <label>Categoría
            <select name="categoria" required>
                <option value="general">General</option>
                <option value="aviso">Aviso</option>
                <option value="evento">Evento</option>
                <option value="compraventa">Compra-venta</option>
            </select>
        </label>
        <div id="campos-especificos"></div>
        <button>Publicar</button>
    </form>
    <p id="salida"></p>

    <output id="vista-previa"></output>
    <button id="btn-actualizar">Actualizar</button>
    <button id="btn-forzar-error">Forzar error</button>
    <p id="estado">Listo</p>
    <section id="lista-publicaciones"></section>
    <script type="module" src="./js/app.js"></script>
</body>

</html>
